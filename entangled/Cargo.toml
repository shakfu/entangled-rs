[package]
name = "entangled"
version = "0.2.0"
edition = "2021"
description = "Literate programming engine - Rust translation"
license = "MIT"
authors = ["Entangled Contributors"]
repository = "https://github.com/entangled/entangled-rs"

[dependencies]
nom = "8"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
glob = "0.3"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
], optional = true }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["highlight"]
clap = ["dep:clap"]
# Server-side syntax highlighting for the weave HTML backend. Pulls in syntect
# (pure-Rust fancy-regex backend). Disable with --no-default-features for a
# smaller binary; code then falls back to semantic `language-xxx` classes.
highlight = ["dep:syntect"]

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false
