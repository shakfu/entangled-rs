name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests and benchmarks are linted too: they are shipped
      # code and were the only places warnings had accumulated.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned so an advisory-database change cannot turn a green build red
      # without a visible commit here. 0.22 is the first release whose rustsec
      # parses the CVSS 4.0 vectors now present in the database; 0.21 refuses
      # to load it at all.
      - run: cargo install cargo-audit --version ^0.22 --locked
      - run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p entangled-rs -p entangled-cli

  pyentangled:
    name: pyentangled (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The contract tests compare the Python CLI against the native one
      # (command list, version, status JSON, exit codes) and skip themselves if
      # it is absent -- so build it, or that half of the suite silently no-ops.
      - name: Build the native CLI
        run: cargo build --release -p entangled-cli
      # The venv holding maturin and pytest lives in pyentangled/, so every
      # step runs there. --no-project stops `uv run` re-syncing from
      # pyproject.toml, which rebuilds .venv and drops both tools; --python
      # repeats the matrix version, without which pyentangled/.python-version
      # (3.13) makes uv reject the venv and fall back to an interpreter that
      # has neither.
      - name: Set up the environment
        working-directory: pyentangled
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install maturin pytest
      - name: Build and install pyentangled
        working-directory: pyentangled
        run: uv run --no-project --python ${{ matrix.python }} maturin develop
      - name: Run pyentangled tests
        working-directory: pyentangled
        run: uv run --no-project --python ${{ matrix.python }} pytest tests/ -v
