[package]
name = "entangled-cli"
version = "0.2.1"
edition = "2021"
description = "CLI for Entangled literate programming engine"
license = "MIT"
authors = ["Shakeeb Alireza <shakeeb.alireza@rezayat.net>"]
repository = "https://github.com/shakfu/entangled-rs"

[dependencies]
entangled-rs = { path = "../entangled", version = "0.2.1", features = ["clap"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
notify = "8"
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "entangled"
path = "src/main.rs"
