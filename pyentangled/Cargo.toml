[package]
name = "pyentangled"
version = "0.2.1"
edition = "2024"
description = "Python bindings for Entangled literate programming engine"
license = "MIT"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
entangled-rs = { path = "../entangled", version = "0.2.1" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
